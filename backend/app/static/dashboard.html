<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>F1 2026 · Live Prediction Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🏁</text></svg>" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>

<div id="boot">
  <canvas id="bootCanvas"></canvas>
  <div id="bootVeil"></div>
  <div class="boot-card">
    <div class="glitch" data-text="F1 2026">F1 2026</div>
    <div class="boot-sub">live prediction dashboard</div>
    <div class="boot-bar"><i></i></div>
    <div id="bootStage">tuning the channel</div>
  </div>
</div>

<canvas id="tube"></canvas>
<div id="tubeVeil"></div>

<div id="island" class="idle" aria-live="polite">
  <div id="islandInner"></div>
</div>
<div id="islandSizer" aria-hidden="true"></div>

<header class="above">
  <div class="brand"><b>F1 2026</b><span>live prediction dashboard</span></div>
  <div class="spacer"></div>
  <span class="pill" id="regime">regime &mdash;</span>
  <div class="menu">
    <button id="panelsBtn">Panels</button>
    <div class="menu-body" id="panelsMenu" hidden></div>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">idle</span></div>
</header>

<main class="above">
  <div class="finder">
    <div class="field">
      <input type="search" id="search" placeholder="Search a race &mdash; circuit, country, month&hellip;" autocomplete="off" />
      <div class="results" id="results" hidden></div>
    </div>
    <span class="pill" id="seasonPill">&mdash;</span>
    <div class="spacer"></div>
    <select id="speed" title="playback speed">
      <option value="1">1&times;</option>
      <option value="4">4&times;</option>
      <option value="10" selected>10&times;</option>
      <option value="30">30&times;</option>
      <option value="60">60&times;</option>
    </select>
    <button id="resetLayout" title="put the panels back where they started">Reset layout</button>
  </div>

  <div id="boardWrap"><div id="board"></div></div>
</main>

<script src="config.js"></script>
<script type="module" src="js/boot.js"></script>
</body>
</html>
