<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>F1 2026 · Live Prediction Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🏁</text></svg>" />
<style>
:root {
  --bg: #000;
  --bg-2: #050609;
  --panel: rgba(9, 11, 15, 0.74);
  --panel-solid: #0a0c10;
  --panel-2: #151920;
  --line: #2b313b;
  --line-soft: #14171d;
  --text: #eceef2;
  --muted: #98a0ab;
  --dim: #646b76;

  /* the two accents, and nothing else */
  --red: #ff2b39;
  --red-deep: #a30f19;
  --red-glow: rgba(255, 43, 57, .45);
  --blue: #3d8bff;
  --blue-deep: #10428f;
  --blue-glow: rgba(61, 139, 255, .45);

  --green: #35c46b;
  --amber: #f0b429;
  --ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI",
        Roboto, "Helvetica Neue", Arial, sans-serif;

  /* One scale for everything that stacks. Content is arranged by the viewer
     and so its order is dynamic; chrome is fixed and always above it. */
  --z-board: 10;      /* docked panels: 10 and up   */
  --z-float: 1000;    /* summoned panels: 1000 and up */
  --z-header: 3000;
  --z-popover: 4000;  /* menus, search results       */
  --z-toast: 5000;
  --z-boot: 9000;
  --mono: ui-monospace, "Cascadia Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }

/* Scrolling is a given; a bar saying how far down you are is not information
   anybody asked for, and on a dark surface it is the brightest thing in a
   panel. Scrolling itself is untouched -- wheel, trackpad, keys and the
   scrollIntoView the search results use all behave exactly as before. */
* { scrollbar-width: none; -ms-overflow-style: none; }
*::-webkit-scrollbar { width: 0; height: 0; display: none; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 14px/1.55 var(--ui);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  display: flex; flex-direction: column; overflow: hidden;
}
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.015em; }
button, select, input { font: inherit; color: inherit; }
button {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 12px; cursor: pointer; font-weight: 500;
  transition: background .15s, border-color .15s, color .15s, box-shadow .15s;
}
button:hover:not(:disabled) { background: #1d222b; border-color: #3b434f; }
button:disabled { opacity: .45; cursor: default; }
button.primary {
  background: linear-gradient(180deg, var(--red), var(--red-deep));
  border-color: var(--red-deep); color: #fff; font-weight: 650;
  box-shadow: 0 0 18px rgba(255, 43, 57, .28);
}
button.primary:hover:not(:disabled) { background: linear-gradient(180deg, #ff4552, #c01420); }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 4px 8px; }
button.ghost:hover:not(:disabled) { background: var(--panel-2); color: var(--text); }
button.accent {
  border-color: var(--blue-deep); color: #cfe0ff;
  background: linear-gradient(180deg, rgba(61,139,255,.20), rgba(16,66,143,.20));
}
button.accent:hover:not(:disabled) { background: rgba(61,139,255,.30); border-color: var(--blue); }
button.accent.on {
  background: linear-gradient(180deg, var(--blue), var(--blue-deep));
  border-color: var(--blue); color: #fff; box-shadow: 0 0 16px rgba(61,139,255,.35);
}
input[type=search], select {
  background: rgba(16, 19, 25, .8); border: 1px solid var(--line); border-radius: 9px; padding: 9px 13px;
}
input[type=search]::placeholder { color: #5b616a; }
input[type=search]:focus, select:focus {
  outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(61,139,255,.16);
}

/* ---------- the tube behind everything ----------
   A dead channel, turned almost all the way down. It is decoration, so it
   never takes a pointer event and it stops entirely when the tab is hidden or
   the viewer has asked for less motion. */
#tube {
  position: fixed; inset: 0; width: 100%; height: 100%;
  z-index: 0; pointer-events: none; opacity: .07;
  transition: opacity .35s ease;
}
/* A fine scan texture over the whole page: too small to see, enough to stop a
   large black area reading as paper. */
body::after {
  content: ""; position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: repeating-linear-gradient(180deg,
    rgba(255,255,255,.014) 0 1px, transparent 1px 3px);
}

#tubeVeil {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background:
    radial-gradient(80% 60% at 12% 22%, rgba(255,43,57,.07), transparent 70%),
    radial-gradient(70% 60% at 88% 78%, rgba(61,139,255,.07), transparent 70%),
    radial-gradient(120% 90% at 50% 0%, rgba(0,0,0,.45), rgba(0,0,0,.92) 70%);
}
.above { position: relative; z-index: 2; }

/* ---------- the loading screen ----------
   The same dead channel as the background, turned all the way up: a set
   warming to a signal it has not found yet. It goes when the page has data. */
#boot {
  position: fixed; inset: 0; z-index: var(--z-boot); background: #000;
  display: grid; place-items: center;
  transition: opacity .55s ease, visibility .55s;
}
#boot.done { opacity: 0; visibility: hidden; pointer-events: none; }
#bootCanvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .55; }
#bootVeil {
  position: absolute; inset: 0;
  background:
    radial-gradient(62% 46% at 50% 50%, rgba(0,0,0,.88), rgba(0,0,0,.45) 62%, rgba(0,0,0,.82)),
    repeating-linear-gradient(180deg, rgba(0,0,0,.42) 0 1px, transparent 1px 3px);
}
.boot-card { position: relative; z-index: 3; text-align: center; padding: 0 24px; }
.glitch {
  position: relative; display: inline-block; color: #fff;
  font: 800 clamp(34px, 8vw, 92px)/1 var(--ui); letter-spacing: -0.05em;
  text-shadow: 0 0 34px rgba(255,255,255,.12);
}
.glitch::before, .glitch::after {
  content: attr(data-text); position: absolute; left: 0; top: 0; width: 100%;
  pointer-events: none;
}
.glitch::before { color: var(--red); text-shadow: 2px 0 var(--red); animation: glitchRed 2.6s infinite steps(1, end); }
.glitch::after  { color: var(--blue); text-shadow: -2px 0 var(--blue); animation: glitchBlue 3.3s infinite steps(1, end); }
@keyframes glitchRed {
  0%, 62%, 100% { clip-path: inset(0 0 100% 0); transform: none; }
  64% { clip-path: inset(14% 0 62% 0); transform: translate(-5px, -1px); }
  67% { clip-path: inset(58% 0 24% 0); transform: translate(4px, 1px); }
  70% { clip-path: inset(32% 0 48% 0); transform: translate(-3px, 0); }
  73% { clip-path: inset(0 0 100% 0); transform: none; }
  88% { clip-path: inset(72% 0 8% 0); transform: translate(6px, 0); }
  91% { clip-path: inset(0 0 100% 0); transform: none; }
}
@keyframes glitchBlue {
  0%, 40%, 100% { clip-path: inset(0 0 100% 0); transform: none; }
  42% { clip-path: inset(44% 0 36% 0); transform: translate(5px, 1px); }
  45% { clip-path: inset(8% 0 76% 0); transform: translate(-6px, -1px); }
  48% { clip-path: inset(0 0 100% 0); transform: none; }
  80% { clip-path: inset(62% 0 18% 0); transform: translate(-5px, 0); }
  83% { clip-path: inset(0 0 100% 0); transform: none; }
}
.boot-sub {
  margin-top: 14px; font-family: var(--mono); font-size: 12px; letter-spacing: .22em;
  text-transform: uppercase; color: var(--muted);
}
.boot-bar {
  margin: 22px auto 0; width: min(340px, 70vw); height: 2px; background: #1b1f27;
  border-radius: 2px; overflow: hidden;
}
.boot-bar i {
  display: block; height: 100%; width: 30%;
  background: linear-gradient(90deg, transparent, var(--red), var(--blue), transparent);
  animation: bootSweep 1.35s cubic-bezier(.6,0,.4,1) infinite;
}
@keyframes bootSweep { 0% { transform: translateX(-110%); } 100% { transform: translateX(360%); } }
#bootStage { margin-top: 12px; font-family: var(--mono); font-size: 11.5px; color: var(--dim); min-height: 16px; }
@media (prefers-reduced-motion: reduce) {
  .glitch::before, .glitch::after, .boot-bar i { animation: none; }
}

/* ---------- shell ---------- */
header {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap; flex: none;
  padding: 9px 18px; border-bottom: 1px solid var(--line-soft);
  background: linear-gradient(180deg, rgba(8,9,12,.94), rgba(4,5,7,.94));
  backdrop-filter: blur(8px);
}
header.above { z-index: var(--z-header); }
main.above { z-index: 2; }
.brand { display: flex; align-items: baseline; gap: 9px; }
.brand b {
  font-size: 15px; font-weight: 800; letter-spacing: -0.04em;
  background: linear-gradient(92deg, var(--red), #fff 55%, var(--blue));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.brand span { color: var(--dim); font-size: 11.5px; }
.spacer { flex: 1; }
.status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #3a3f47; flex: none; }
.dot.live { background: var(--blue); box-shadow: 0 0 9px var(--blue); }
.dot.error { background: var(--red); box-shadow: 0 0 9px var(--red); }
.pill {
  font-size: 11px; padding: 2px 9px; border-radius: 999px;
  border: 1px solid var(--line); background: rgba(16,19,25,.7); color: var(--muted);
}

main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 12px 16px 14px; }

/* ---------- search ---------- */
.finder { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; flex: none; }
.finder .field { position: relative; flex: 1; min-width: 240px; max-width: 520px; }
.finder input[type=search] { width: 100%; padding-left: 34px; }
.finder .field::before {
  content: "\2315"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--dim); font-size: 15px; pointer-events: none;
}
.results {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: var(--z-popover);
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 22px 50px rgba(0,0,0,.7); max-height: 340px; overflow: auto;
}
.results[hidden] { display: none; }
.result {
  display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center;
  padding: 9px 13px; border-bottom: 1px solid var(--line-soft); cursor: pointer;
}
.result:last-child { border-bottom: none; }
.result:hover, .result.active { background: var(--panel-2); box-shadow: inset 2px 0 0 var(--red); }
.result b { font-weight: 650; font-size: 13.5px; }
.result small { color: var(--dim); font-size: 11.5px; display: block; }
.badge { font-size: 10px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.badge.ready { color: #9fc4ff; border-color: var(--blue-deep); background: rgba(16,66,143,.28); }
.badge.soon { color: #ff9aa3; border-color: var(--red-deep); background: rgba(163,15,25,.24); }

/* ---------- the board ----------
   Panels float free over the whole area: moved by dragging the header, resized
   from any edge or corner, allowed to overlap, and whatever was touched last
   comes to the front. Nothing is docked to a grid cell. */
#boardWrap { position: relative; flex: 1; min-height: 0; overflow: hidden; }
#board::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: 16px;
  background:
    radial-gradient(70% 50% at 20% 0%, rgba(255,43,57,.05), transparent 70%),
    radial-gradient(60% 50% at 90% 100%, rgba(61,139,255,.05), transparent 70%);
}

/* The grid is invisible until something is being placed against it, which is
   the only moment it is information rather than decoration. */
#board::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
  opacity: 0; transition: opacity .22s ease;
  background-image:
    linear-gradient(90deg, rgba(61,139,255,.16) 1px, transparent 1px),
    linear-gradient(180deg, rgba(61,139,255,.16) 1px, transparent 1px);
  background-size: calc(100% / 24) calc(100% / 12);
  -webkit-mask-image: radial-gradient(120% 120% at 50% 50%, #000 55%, transparent 100%);
          mask-image: radial-gradient(120% 120% at 50% 50%, #000 55%, transparent 100%);
}
#board.gridded::after { opacity: 1; }

/* Where the panel will land. */
#ghost {
  position: absolute; z-index: 900; pointer-events: none; border-radius: 18px;
  border: 1px solid rgba(61,139,255,.55);
  background: rgba(61,139,255,.07);
  box-shadow: 0 0 0 1px rgba(61,139,255,.12), inset 0 0 26px rgba(61,139,255,.10);
  transition: left .12s ease, top .12s ease, width .12s ease, height .12s ease;
}
#ghost[hidden] { display: none; }

/* A panel let go of does not snap; it settles. */
.widget.settling {
  transition: left .3s cubic-bezier(.22,1.1,.32,1), top .3s cubic-bezier(.22,1.1,.32,1),
              width .3s cubic-bezier(.22,1.1,.32,1), height .3s cubic-bezier(.22,1.1,.32,1),
              box-shadow .3s ease, transform .3s ease;
}
.widget.dragging { transition: box-shadow .2s ease, transform .2s ease; }
#board { position: absolute; inset: 0; }
.widget {
  position: absolute;
  background: linear-gradient(180deg, rgba(21,24,31,.78), rgba(13,15,20,.80));
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 18px;
  backdrop-filter: blur(26px) saturate(1.6);
  display: flex; flex-direction: column; overflow: hidden;
  /* ambient cast + contact shadow + the hairline of light along the top */
  box-shadow:
    0 18px 40px -12px rgba(0,0,0,.55),
    0 3px 10px -3px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.06);
  transition: box-shadow .3s ease, transform .34s cubic-bezier(.22,1,.36,1),
              border-color .2s ease;
}
/* The accent is the panel saying what it is, without a label doing it. */
.widget::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--tint, transparent) 22%,
                                     var(--tint, transparent) 78%, transparent);
  opacity: .5; pointer-events: none;
}
/* Corner brackets, on the panel being used. Instrument panels mark their
   corners; it costs one gradient and reads as machined rather than drawn. */
.widget::after {
  content: ""; position: absolute; inset: 7px; border-radius: 12px;
  pointer-events: none; opacity: 0; transition: opacity .2s ease;
  background:
    linear-gradient(var(--tint, var(--blue)), var(--tint, var(--blue))) 0 0 / 11px 1px no-repeat,
    linear-gradient(var(--tint, var(--blue)), var(--tint, var(--blue))) 0 0 / 1px 11px no-repeat,
    linear-gradient(var(--tint, var(--blue)), var(--tint, var(--blue))) 100% 0 / 11px 1px no-repeat,
    linear-gradient(var(--tint, var(--blue)), var(--tint, var(--blue))) 100% 0 / 1px 11px no-repeat,
    linear-gradient(var(--tint, var(--blue)), var(--tint, var(--blue))) 0 100% / 11px 1px no-repeat,
    linear-gradient(var(--tint, var(--blue)), var(--tint, var(--blue))) 0 100% / 1px 11px no-repeat,
    linear-gradient(var(--tint, var(--blue)), var(--tint, var(--blue))) 100% 100% / 11px 1px no-repeat,
    linear-gradient(var(--tint, var(--blue)), var(--tint, var(--blue))) 100% 100% / 1px 11px no-repeat;
}
.widget:hover::after, .widget.active::after { opacity: .3; }
.widget.pinned::after { display: none; }

.widget:hover, .widget.active {
  border-color: rgba(255,255,255,.12);
  box-shadow:
    0 26px 56px -14px rgba(0,0,0,.66),
    0 4px 14px -4px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.09);
}
.widget.dragging {
  transform: scale(1.018); cursor: grabbing;
  border-color: rgba(255,255,255,.16);
  box-shadow:
    0 44px 90px -20px rgba(0,0,0,.8),
    0 8px 24px -6px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.12);
}
.widget.sizing { border-color: var(--tint, var(--line)); }
.widget.floating {
  box-shadow:
    0 40px 80px -18px rgba(0,0,0,.75),
    0 6px 20px -5px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.10);
}

/* Per-panel accent. Red for what the race is doing to itself, blue for what
   the cars are doing to each other. */
.widget[data-panel="map"]        { --tint: var(--red); }
.widget[data-panel="order"]      { --tint: var(--blue); }
.widget[data-panel="notify"]     { --tint: var(--blue); }
.widget[data-panel="control"]    { --tint: var(--red); }
.widget[data-panel="prediction"] { --tint: var(--blue); }
.widget[data-panel="log"]        { --tint: var(--dim); }

/* The circuit is the page. It is not a card lying on the desktop, it is the
   desktop, so it gets no frame and casts no shadow. */
.widget.pinned {
  background: transparent; border-color: transparent; box-shadow: none;
  backdrop-filter: none; border-radius: 16px;
}
.widget.pinned::before { display: none; }
.widget.pinned:hover, .widget.pinned.active {
  border-color: transparent; box-shadow: none;
}
.widget.pinned .w-head { cursor: default; border-bottom-color: transparent !important; }
.widget.pinned .w-head .grip { display: none; }
.w-head {
  display: flex; align-items: center; gap: 9px; padding: 10px 13px 9px;
  border-bottom: 1px solid transparent; cursor: grab; user-select: none; flex: none;
  transition: border-color .2s;
}
.widget:hover .w-head, .widget.active .w-head { border-bottom-color: var(--line-soft); }
.w-head:active { cursor: grabbing; }
.w-head h2 {
  font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
  font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  min-width: 0; flex: 0 1 auto;
}
.w-head .grip { color: #333941; letter-spacing: -2px; font-size: 13px; opacity: 0; transition: opacity .18s; }
.widget:hover .w-head .grip { opacity: 1; }
.w-head .ghost { opacity: 0; transition: opacity .18s; }
.widget:hover .w-head .ghost, .widget.active .w-head .ghost { opacity: 1; }
.w-body { flex: 1; overflow: auto; min-height: 0; }

/* Eight grips, invisible until the pointer is on the panel. */
.w-handle { position: absolute; opacity: 0; transition: opacity .18s; touch-action: none; }
.widget:hover .w-handle { opacity: 1; }
.w-handle.n { top: 0; left: 16px; right: 16px; height: 6px; cursor: ns-resize; }
.w-handle.s { bottom: 0; left: 16px; right: 16px; height: 6px; cursor: ns-resize; }
.w-handle.w { left: 0; top: 16px; bottom: 16px; width: 6px; cursor: ew-resize; }
.w-handle.e { right: 0; top: 16px; bottom: 16px; width: 6px; cursor: ew-resize; }
.w-handle.nw { top: 0; left: 0; width: 16px; height: 16px; cursor: nwse-resize; }
.w-handle.ne { top: 0; right: 0; width: 16px; height: 16px; cursor: nesw-resize; }
.w-handle.sw { bottom: 0; left: 0; width: 16px; height: 16px; cursor: nesw-resize; }
.w-handle.se {
  bottom: 0; right: 0; width: 20px; height: 20px; cursor: nwse-resize;
  background: linear-gradient(135deg, transparent 47%, var(--red) 49%, transparent 51%,
                                      transparent 62%, var(--blue) 64%, transparent 66%);
}
@media (max-width: 900px) {
  body { overflow: auto; height: auto; }
  main { padding: 12px; }
  #boardWrap { position: static; }
  #board { position: static; display: flex; flex-direction: column; gap: 12px; }
  .widget { position: static !important; width: auto !important; height: 340px !important;
            border-color: rgba(255,255,255,.09); }
  .widget.pinned { height: 420px !important; }
  .w-handle { display: none; }
}

/* ---------- map widget ---------- */
#mapWrap { position: relative; flex: 1; min-height: 0; display: flex; }
svg#map { display: block; width: 100%; height: 100%; }
#trackGlow { fill: none; stroke: var(--red); stroke-width: 30; stroke-linejoin: round;
  stroke-linecap: round; opacity: .16; filter: blur(13px); }
#trackHalo { fill: none; stroke: #ff5a64; stroke-width: 19; stroke-linejoin: round;
  stroke-linecap: round; opacity: .18; filter: blur(4px); }
#trackLine { fill: none; stroke: #e9edf3; stroke-width: 15; stroke-linejoin: round;
  stroke-linecap: round; opacity: .3; }
#trackSurface { fill: none; stroke: #05070a; stroke-width: 11; stroke-linejoin: round;
  stroke-linecap: round; }
#pitLine { fill: none; stroke: var(--blue); stroke-width: 7; stroke-linejoin: round;
  stroke-linecap: round; opacity: .5; }
#pitSurface { fill: none; stroke: #05070a; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
#startLine { stroke: #fff; stroke-width: 3.5; opacity: .85; }
.car { cursor: pointer; }
.car-dot { r: 13; stroke: #000; stroke-width: 2; transition: r .12s; }
.car:hover .car-dot { r: 15; }
.car-label { font-size: 12px; font-weight: 800; fill: #000; text-anchor: middle;
  dominant-baseline: central; pointer-events: none; letter-spacing: -0.02em; }
.car-name { font-size: 10.5px; font-weight: 700; fill: var(--text); text-anchor: middle;
  paint-order: stroke; stroke: #000; stroke-width: 3.5; stroke-linejoin: round; pointer-events: none; }
.car.pit .car-dot { opacity: .5; }
.car-tag { font-size: 9.5px; font-weight: 700; fill: var(--blue); text-anchor: middle;
  paint-order: stroke; stroke: #000; stroke-width: 3; }
.car.selected .car-dot { stroke: #fff; stroke-width: 2.5; }
.selected .car-name { fill: #fff; }

/* the countdown, in the middle of the circuit it counts down to */
#countdown {
  position: absolute; inset: 0; display: grid; place-content: center; text-align: center;
  pointer-events: none; z-index: 2;
}
#countdown[hidden] { display: none; }
#countdown .k { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
#countdown .t {
  font-family: var(--mono); font-size: clamp(28px, 4.4vw, 54px); font-weight: 600;
  letter-spacing: -0.02em; color: var(--text); margin: 6px 0 2px;
  text-shadow: 0 0 34px rgba(255,43,57,.32);
}
#countdown .w { color: var(--dim); font-size: 12px; }

.flag {
  font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  padding: 3px 9px; border-radius: 999px; border: 1px solid; flex: none;
  white-space: nowrap;
}
.flag.green { color: #9fc4ff; border-color: var(--blue-deep); background: rgba(16,66,143,.26); }
.flag.yellow { color: var(--amber); border-color: #6b5314; background: #241d0c; }
.flag.vsc, .flag.safety_car { color: var(--amber); border-color: #6b5314; background: #2a2110; }
.flag.red_flag { color: #ff8189; border-color: var(--red-deep); background: rgba(163,15,25,.3); }

/* ---------- transport ---------- */
.transport { display: flex; align-items: center; gap: 11px; padding: 10px 12px;
  border-top: 1px solid var(--line-soft); flex: none; }
.transport .clock { font-family: var(--mono); font-size: 11.5px; color: var(--muted); min-width: 98px; }
.lapcount { font-variant-numeric: tabular-nums; font-weight: 650; min-width: 88px; font-size: 13px; }
.scrubwrap { flex: 1; display: flex; flex-direction: column; gap: 5px; min-width: 80px; }
.scrubwrap input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; margin: 0;
  height: 6px; border-radius: 3px; cursor: pointer; background: #1b1f27;
  background-image: linear-gradient(90deg, var(--red) 0 calc(var(--played, 0) * 1%),
                                           #1b1f27 calc(var(--played, 0) * 1%) 100%);
}
.scrubwrap input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%;
  background: #fff; border: 2px solid var(--red); box-shadow: 0 0 10px var(--red-glow);
}
.scrubwrap input[type=range]::-moz-range-thumb {
  width: 12px; height: 12px; border-radius: 50%;
  background: #fff; border: 2px solid var(--red); box-shadow: 0 0 10px var(--red-glow);
}
.scrubwrap input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: transparent; }
#flagStrip { height: 4px; border-radius: 2px; background: #1b1f27; }

/* ---------- lists ---------- */
.order-row {
  display: grid; grid-template-columns: 22px 4px 1fr auto; gap: 9px; align-items: center;
  padding: 6px 13px; border-bottom: 1px solid var(--line-soft); cursor: pointer;
}
.order-row:hover { background: var(--panel-2); }
.order-row.leader { background: linear-gradient(90deg, rgba(255,43,57,.12), transparent 62%); }
.order-row .pos { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; font-size: 12px; }
.order-row.leader .pos { color: var(--red); font-weight: 700; }
.order-row .bar { width: 4px; height: 21px; border-radius: 2px; }
.order-row .who { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.order-row .who b { font-size: 13px; font-weight: 700; letter-spacing: -0.01em; }
.order-row .who small { color: var(--dim); font-size: 11px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.order-row .gap { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px;
  display: flex; align-items: center; gap: 7px; }
.order-row .gap .t { min-width: 46px; text-align: right; }
.tyre { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); }
.tyre.SOFT { color: #ff6b6b; border-color: #5c2626; }
.tyre.MEDIUM { color: var(--amber); border-color: #5c4a1a; }
.tyre.HARD { color: #dfe3e8; border-color: #3a4048; }
.tyre.INTERMEDIATE { color: var(--green); border-color: #1e5c37; }
.tyre.WET { color: var(--blue); border-color: var(--blue-deep); }

.rc-row {
  display: grid; grid-template-columns: 52px minmax(74px, auto) 1fr; gap: 9px; align-items: center;
  padding: 6px 13px; border-bottom: 1px solid var(--line-soft); font-size: 12.5px;
}
.rc-row:hover { background: var(--panel-2); }
.rc-row .at { color: var(--dim); font-family: var(--mono); font-size: 11px; }
.rc-row .msg { color: #b6bdc6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- notifications ----------
   Two places, one feed: a panel that keeps everything, and a short-lived card
   in the corner for whatever has just happened. */
.notif {
  display: grid; grid-template-columns: 3px 1fr; gap: 10px; align-items: stretch;
  border-bottom: 1px solid var(--line-soft);
  animation: notifIn .35s cubic-bezier(.2,.9,.25,1);
}
@keyframes notifIn { from { opacity: 0; transform: translateY(-7px); } to { opacity: 1; transform: none; } }
.notif .edge { border-radius: 0 2px 2px 0; }
.notif.pass .edge { background: var(--blue); box-shadow: 0 0 12px var(--blue-glow); }
.notif.control .edge { background: var(--red); box-shadow: 0 0 12px var(--red-glow); }
.notif.drop .edge { background: var(--amber); box-shadow: 0 0 12px rgba(240,180,41,.45); }
.notif.drop b { color: var(--amber); }
.notif .txt { padding: 7px 12px 8px 2px; min-width: 0; }
.notif b { font-size: 12.5px; font-weight: 700; letter-spacing: -0.01em; }
.notif.pass b { color: #a9c9ff; }
.notif.control b { color: #ff9aa3; }
.notif small { display: block; color: var(--muted); font-size: 11.5px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.notif .when { float: right; color: var(--dim); font-family: var(--mono); font-size: 10.5px; }

/* ---------- the island ----------
   One place, at the top of the page, for anything the page wants to say.

   At rest it is a small pill carrying the state of the session -- the flag and
   the lap -- which is worth having on screen anyway. When something happens it
   grows to fit what it has to say, says it, and shrinks back. Growing and
   shrinking is the whole idea: it is the same object throughout, so there is
   never a stack of cards to read or dismiss, and it never covers the circuit.

   Width and height are animated between measured pixel values, because a
   transition cannot run to `auto`. #islandSizer lays the next content out
   off-screen to find out how big the island needs to become. */
#island {
  position: fixed; top: 12px; left: 50%; z-index: var(--z-toast);
  transform: translateX(-50%);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; border-radius: 999px;
  background: #000;
  border: 1px solid rgba(255,255,255,.09);
  box-shadow: 0 10px 30px -8px rgba(0,0,0,.8), 0 2px 8px rgba(0,0,0,.6),
              inset 0 1px 0 rgba(255,255,255,.06);
  width: 168px; height: 34px;
  transition: width .52s cubic-bezier(.16,1.16,.3,1),
              height .52s cubic-bezier(.16,1.16,.3,1);
  will-change: width, height;
}
#island.hidden { opacity: 0; pointer-events: none; transition: opacity .3s ease; }
#island.speaking { border-color: rgba(255,255,255,.16); }

#islandInner, #islandSizer {
  display: flex; align-items: center; gap: 11px;
  padding: 5px 16px; white-space: nowrap;
}
#islandInner {
  transition: opacity .2s ease, transform .34s cubic-bezier(.16,1.16,.3,1),
              filter .24s ease;
}
#islandInner.swap { opacity: 0; transform: scale(.86); filter: blur(5px); }

#islandSizer {
  position: fixed; top: -400px; left: -9999px; visibility: hidden;
  pointer-events: none; height: auto;
}

.isl-dot {
  width: 7px; height: 7px; border-radius: 50%; flex: none;
  background: var(--dim); box-shadow: 0 0 8px currentColor;
}
.isl-dot.green   { background: var(--blue); color: var(--blue); }
.isl-dot.yellow, .isl-dot.vsc, .isl-dot.safety_car { background: var(--amber); color: var(--amber); }
.isl-dot.red_flag { background: var(--red); color: var(--red); }
.isl-dot.pass    { background: var(--blue); color: var(--blue); }
.isl-dot.control { background: var(--red); color: var(--red); }
.isl-dot.drop    { background: var(--amber); color: var(--amber); }

.isl-idle {
  font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); font-weight: 600;
}
.isl-idle b { color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: .02em; }

.isl-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.isl-text b {
  font-size: 13px; font-weight: 650; letter-spacing: -0.01em; color: #fff; line-height: 1.25;
}
.isl-text small { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.isl-stamp {
  font-family: var(--mono); font-size: 10.5px; color: var(--dim); flex: none;
  padding-left: 2px;
}

/* Time running out, drawn around the bottom of the pill. */
#islandLife {
  position: absolute; left: 0; bottom: 0; height: 2px; width: 100%;
  transform-origin: 0 50%; transform: scaleX(0); opacity: .55;
}
#islandLife.pass { background: var(--blue); }
#islandLife.control { background: var(--red); }
#islandLife.drop { background: var(--amber); }

@media (max-width: 900px) { #island { display: none; } }
@media (prefers-reduced-motion: reduce) {
  #island, #islandInner { transition: none; }
}
}

table { width: 100%; border-collapse: collapse; }

/* ---------- panels menu ---------- */
.menu { position: relative; }
.menu-body {

}
.menu-body[hidden] { display: none; }

}

.menu-body input { accent-color: var(--blue); }
.menu-body hr { border: none; border-top: 1px solid var(--line-soft); margin: 6px 4px; }
.menu-body button { width: 100%; }

  padding: 6px 9px 2px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--dim); font-weight: 600;
}
.menu-body button.preset {
  display: block; text-align: left; background: transparent; border-color: transparent;
  padding: 7px 9px; border-radius: 8px;
}
.menu-body button.preset:hover { background: var(--panel-2); border-color: transparent; }
.menu-body button.preset b { display: block; font-size: 13px; font-weight: 600; color: var(--text); }
.menu-body button.preset small { display: block; color: var(--dim); font-size: 11.5px; margin-top: 1px; }
.menu-body button.preset.on { background: rgba(61,139,255,.12); }
.menu-body button.preset.on b { color: #bcd5ff; }

/* -- panel size ---------------------------------------------------------- */
.size-menu { position: relative; display: flex; align-items: center; }
.w-head .size-btn {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .02em;

}
.widget:hover .w-head .size-btn, .widget.active .w-head .size-btn { opacity: 1; }
.w-head .size-btn:hover { color: var(--text); background: var(--panel-2); }
.size-list {
  position: absolute; right: 0; top: calc(100% + 7px); z-index: var(--z-popover);
  min-width: 168px; padding: 5px;
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 11px;
  box-shadow: 0 22px 50px rgba(0,0,0,.72);
}
.size-list[hidden] { display: none; }
.size-list button {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  width: 100%; text-align: left; background: transparent; border-color: transparent;
  padding: 6px 8px; border-radius: 7px; font-size: 12.5px; color: var(--text);
}

}

.size-list button.on em { color: #9fc4ff; }

#log { max-height: 100%; overflow: auto; padding: 8px 13px; font-family: var(--mono);
  font-size: 11.5px; color: var(--muted); }
#log div { padding: 2px 0; border-bottom: 1px solid #131519; }

</style>
</head>
<body>

<div id="boot">
  <canvas id="bootCanvas"></canvas>
  <div id="bootVeil"></div>

    <div class="glitch" data-text="F1 2026">F1 2026</div>
    <div class="boot-sub">live prediction dashboard</div>
    <div class="boot-bar"><i></i></div>
    <div id="bootStage">tuning the channel</div>
  </div>
</div>

<canvas id="tube"></canvas>
<div id="tubeVeil"></div>

<div id="island" class="idle" aria-live="polite">
  <div id="islandInner"></div>
</div>
<div id="islandSizer" aria-hidden="true"></div>

<header class="above">
  <div class="brand"><b>F1 2026</b><span>live prediction dashboard</span></div>
  <div class="spacer"></div>
  <span class="pill" id="regime">regime &mdash;</span>
  <div class="menu">
    <button id="panelsBtn">Panels</button>
    <div class="menu-body" id="panelsMenu" hidden></div>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">idle</span></div>
</header>

<main class="above">
  <div class="finder">
    <div class="field">
      <input type="search" id="search" placeholder="Search a race &mdash; circuit, country, month&hellip;" autocomplete="off" />
      <div class="results" id="results" hidden></div>
    </div>
    <span class="pill" id="seasonPill">&mdash;</span>
    <div class="spacer"></div>
    <select id="speed" title="playback speed">
      <option value="1">1&times;</option>
      <option value="4">4&times;</option>
      <option value="10" selected>10&times;</option>
      <option value="30">30&times;</option>
      <option value="60">60&times;</option>
    </select>
    <button id="resetLayout" title="put the panels back where they started">Reset layout</button>
  </div>

  <div id="boardWrap"><div id="board"></div></div>
</main>

<script>
"use strict";

/* ==========================================================================
 * One page. A race is chosen from the search bar; if it has run it plays, and
 * if it has not, the circuit stands with a countdown in the middle of it.
 * Everything else is a panel the viewer can move, resize or put away.
 * ====================================================================== */

const params = new URLSearchParams(location.search);
const el = (id) => document.getElementById(id);
const svgNS = "http://www.w3.org/2000/svg";
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

let API = params.get("api") || "";
let WS_BASE = "";

async function detectApi() {
  const candidates = API ? [API] : [location.origin + "/api", location.origin];
  for (const base of candidates) {
    try {
      const response = await fetch(`${base.replace(/\/$/, "")}/health`);
      if (response.ok) return base.replace(/\/$/, "");
    } catch (_) { /* try the next one */ }
  }
  return location.origin;
}

async function api(path, options) {
  const response = await fetch(`${API}${path}`, options);
  if (!response.ok) throw new Error(`${response.status} ${(await response.text()).slice(0, 200)}`);
  return response.json();
}

function setStatus(text, state) {
  el("statusText").textContent = text;
  el("dot").className = "dot" + (state ? " " + state : "");
}

const clock = (seconds) => {
  const s = Math.max(0, Math.round(seconds));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
};
const when = (iso) => (iso ? new Date(iso).toLocaleString(undefined,
  { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "");

/* ======================================================================
 * The board: panels the viewer arranges
 *
 * Panels float over the board rather than sitting in a grid. Each one keeps
 * its place as a fraction of the board, not a pixel count, so a window resize
 * moves everything together instead of throwing the arrangement away. They may
 * overlap; the last one touched comes to the front.
 * ================================================================== */

/* ======================================================================
 * The board: a grid, and panels that live in cells of it
 *
 * Free placement gave the viewer a pixel to land on and no reason to prefer
 * any particular one, so arrangements came out almost-aligned. A grid removes
 * the question: a panel occupies whole cells, every edge lands on a line, and
 * two panels put side by side are exactly side by side.
 *
 * The cell is small -- a twenty-fourth of the width, a twelfth of the height --
 * so the grid guides rather than dictates, the way an icon grid does. Panels
 * are then described the way a phone describes a widget: a size in cells, with
 * a handful of named sizes for the common ones.
 * ================================================================== */

const GRID_COLS = 24;
const GRID_ROWS = 12;

//: Below this a panel has a heading and no room for anything under it.
const MIN_CW = 4, MIN_CH = 2;

const PANELS = [
  // The circuit is the page, so it does not move. It is pinned to the left for
  // its whole height and the only thing the viewer changes is how wide it is --
  // which is the same gesture as making the column beside it narrower.
  { id: "map",        title: "Circuit",       c: 0,  r: 0, cw: 14, ch: 12, always: true, pinned: true },
  { id: "order",      title: "Running order", c: 14, r: 0, cw: 5,  ch: 12 },
  { id: "notify",     title: "Notifications", c: 19, r: 0, cw: 5,  ch: 6 },
  { id: "control",    title: "Race control",  c: 19, r: 6, cw: 5,  ch: 6 },
  { id: "prediction", title: "Prediction",    c: 4,  r: 1, cw: 11, ch: 9, off: true, float: true },
  { id: "log",        title: "Live feed",     c: 14, r: 7, cw: 5,  ch: 5, off: true },
];

/** The sizes a panel is usually wanted at, named. Same idea as a phone's
 *  small / medium / large: most of the time somebody wants one of a few
 *  shapes, and picking one from a list beats dragging to it. */
const SIZES = [
  { key: "small",  label: "Small",  cw: 5,  ch: 4 },
  { key: "wide",   label: "Wide",   cw: 10, ch: 4 },
  { key: "tall",   label: "Tall",   cw: 5,  ch: 8 },
  { key: "large",  label: "Large",  cw: 10, ch: 8 },
  { key: "column", label: "Column", cw: 5,  ch: 12 },
];

/** Arrangements worth starting from, in cells.
 *
 *  The useful ones are not arbitrary -- they follow what somebody is doing.
 *  Watching a race wants the order beside the track; reading strategy wants the
 *  projection open and large; arguing about a call wants race control given
 *  real room. The circuit is pinned left in all of them; only its width moves. */
const PRESETS = {
  broadcast: {
    label: "Broadcast",
    hint: "the track, the order, and what just happened",
    panels: {
      map:        { c: 0,  r: 0, cw: 14, ch: 12, visible: true },
      order:      { c: 14, r: 0, cw: 5,  ch: 12, visible: true },
      notify:     { c: 19, r: 0, cw: 5,  ch: 6,  visible: true },
      control:    { c: 19, r: 6, cw: 5,  ch: 6,  visible: true },
      prediction: { c: 4,  r: 1, cw: 11, ch: 9,  visible: false },
      log:        { c: 14, r: 7, cw: 5,  ch: 5,  visible: false },
    },
  },
  strategy: {
    label: "Strategy",
    hint: "the projection, given room to be read",
    panels: {
      map:        { c: 0,  r: 0, cw: 10, ch: 12, visible: true },
      prediction: { c: 10, r: 0, cw: 9,  ch: 12, visible: true },
      order:      { c: 19, r: 0, cw: 5,  ch: 8,  visible: true },
      notify:     { c: 19, r: 8, cw: 5,  ch: 4,  visible: true },
      control:    { c: 10, r: 7, cw: 9,  ch: 5,  visible: false },
      log:        { c: 14, r: 7, cw: 5,  ch: 5,  visible: false },
    },
  },
  stewards: {
    label: "Stewards",
    hint: "every call, in full, next to the order it changed",
    panels: {
      map:        { c: 0,  r: 0, cw: 9,  ch: 12, visible: true },
      control:    { c: 9,  r: 0, cw: 9,  ch: 12, visible: true },
      order:      { c: 18, r: 0, cw: 6,  ch: 7,  visible: true },
      notify:     { c: 18, r: 7, cw: 6,  ch: 5,  visible: true },
      prediction: { c: 4,  r: 1, cw: 11, ch: 9,  visible: false },
      log:        { c: 14, r: 7, cw: 5,  ch: 5,  visible: false },
    },
  },
  wall: {
    label: "Pit wall",
    hint: "everything at once, for a second screen",
    panels: {
      map:        { c: 0,  r: 0, cw: 11, ch: 12, visible: true },
      order:      { c: 11, r: 0, cw: 5,  ch: 12, visible: true },
      prediction: { c: 16, r: 0, cw: 8,  ch: 6,  visible: true },
      notify:     { c: 16, r: 6, cw: 4,  ch: 6,  visible: true },
      control:    { c: 20, r: 6, cw: 4,  ch: 6,  visible: true },
      log:        { c: 14, r: 7, cw: 5,  ch: 5,  visible: false },
    },
  },
  focus: {
    label: "Focus",
    hint: "the circuit, and nothing competing with it",
    panels: {
      map:        { c: 0,  r: 0, cw: 18, ch: 12, visible: true },
      order:      { c: 18, r: 0, cw: 6,  ch: 12, visible: true },
      notify:     { c: 19, r: 0, cw: 5,  ch: 6,  visible: false },
      control:    { c: 19, r: 6, cw: 5,  ch: 6,  visible: false },
      prediction: { c: 4,  r: 1, cw: 11, ch: 9,  visible: false },
      log:        { c: 14, r: 7, cw: 5,  ch: 5,  visible: false },
    },
  },
};

const DEFAULT_PRESET = "broadcast";
let currentPreset = DEFAULT_PRESET;

function applyPreset(name) {
  const preset = PRESETS[name];
  if (!preset) return;
  for (const [id, box] of Object.entries(preset.panels)) {
    if (!layout[id]) continue;
    Object.assign(layout[id], box, { restore: null });
  }
  layout.map.visible = true;
  currentPreset = name;
  zTop = 10;
  PANELS.forEach((panel, index) => { layout[panel.id].z = 10 + index; });
  saveLayout();
  buildBoard();
  buildPanelsMenu();
  if (layout.prediction.visible) refreshProjection(player.lap || 1);
  if (player.bounds) { fitMap(); renderFrame(player.time); }
}

const LAYOUT_KEY = "f1dash.layout.v4";
const BY_ID = Object.fromEntries(PANELS.map((panel) => [panel.id, panel]));

/** A floating panel is one the viewer summoned over the board rather than one
 *  docked on it, so it sits above the lot -- otherwise clicking the map (its
 *  play button counts) would bring the map over the prediction that the map's
 *  own button had just opened. */
const FLOAT_LIFT = 1000;   /* matches --z-float */
const zOf = (id) => layout[id].z + (BY_ID[id].float ? FLOAT_LIFT : 0);

let layout = loadLayout();
let zTop = 10;

function loadLayout() {
  const base = {};
  PANELS.forEach((panel, index) => {
    base[panel.id] = {
      c: panel.c, r: panel.r, cw: panel.cw, ch: panel.ch,
      z: 10 + index, visible: !panel.off,
    };
  });
  try {
    const saved = JSON.parse(localStorage.getItem(LAYOUT_KEY) || "null");
    if (saved && saved.panels) {
      currentPreset = saved.preset || DEFAULT_PRESET;
      for (const id of Object.keys(base)) Object.assign(base[id], saved.panels[id] || {});
    }
  } catch (_) { /* a corrupt layout is not worth a broken page */ }
  base.map.visible = true;  // the circuit is the page
  return base;
}

function saveLayout() {
  try {
    localStorage.setItem(LAYOUT_KEY,
      JSON.stringify({ preset: currentPreset, panels: layout }));
  } catch (_) {}
}

/** Panel bodies are built once and moved around, never re-rendered on layout
 *  changes: a re-render would lose scroll position and the playing map. */
const bodies = {};
const widgets = {};

function boardSize() {
  const wrap = el("boardWrap");
  return { W: Math.max(wrap.clientWidth, 1), H: Math.max(wrap.clientHeight, 1) };
}

/** One cell, in pixels. */
function cell() {
  const { W, H } = boardSize();
  return { w: W / GRID_COLS, h: H / GRID_ROWS };
}

const clampCell = (value, span, max) => Math.max(0, Math.min(value, max - span));

/** Write a panel's cell rectangle out as pixels. A gutter is taken out of the
 *  cell rather than added between panels, so two panels in adjacent cells are
 *  exactly one gutter apart however they are placed. */
const GUTTER = 10;

function place(id) {
  const widget = widgets[id];
  const state = layout[id];
  if (!widget || !state) return;
  const { w, h } = cell();

  if (BY_ID[id].pinned) { state.c = 0; state.r = 0; state.ch = GRID_ROWS; }
  state.cw = Math.max(MIN_CW, Math.min(state.cw, GRID_COLS));
  state.ch = Math.max(MIN_CH, Math.min(state.ch, GRID_ROWS));
  state.c = clampCell(state.c, state.cw, GRID_COLS);
  state.r = clampCell(state.r, state.ch, GRID_ROWS);

  widget.style.left = `${(state.c * w + GUTTER / 2).toFixed(1)}px`;
  widget.style.top = `${(state.r * h + GUTTER / 2).toFixed(1)}px`;
  widget.style.width = `${(state.cw * w - GUTTER).toFixed(1)}px`;
  widget.style.height = `${(state.ch * h - GUTTER).toFixed(1)}px`;
  widget.style.zIndex = zOf(id);
}

function placeAll() {
  for (const id of Object.keys(widgets)) place(id);
  if (player.bounds) { fitMap(); renderFrame(player.time); }
}

function bringToFront(id) {
  layout[id].z = ++zTop;
  if (widgets[id]) widgets[id].style.zIndex = zOf(id);
  for (const [other, node] of Object.entries(widgets)) node.classList.toggle("active", other === id);
}

/** Fill the board with one panel, or give it back the cells it came from. */
function toggleFull(id) {
  const state = layout[id];
  if (state.restore) {
    Object.assign(state, state.restore);
    state.restore = null;
  } else {
    state.restore = { c: state.c, r: state.r, cw: state.cw, ch: state.ch };
    Object.assign(state, { c: 0, r: 0, cw: GRID_COLS, ch: GRID_ROWS });
  }
  bringToFront(id);
  place(id);
  saveLayout();
  if (id === "map" && player.bounds) { fitMap(); renderFrame(player.time); }
}

/** Give a panel one of the named sizes, keeping its top-left corner. */
function setSize(id, cw, ch) {
  const state = layout[id];
  state.cw = Math.max(MIN_CW, Math.min(cw, GRID_COLS));
  state.ch = Math.max(MIN_CH, Math.min(ch, GRID_ROWS));
  state.restore = null;
  bringToFront(id);
  place(id);
  saveLayout();
  if (id === "map" && player.bounds) { fitMap(); renderFrame(player.time); }
}

function setPanelVisible(id, visible) {
  layout[id].visible = visible;
  if (visible) layout[id].z = ++zTop;
  saveLayout();
  buildBoard();
  buildPanelsMenu();
}

function buildBoard() {
  const board = el("board");
  board.textContent = "";
  for (const key of Object.keys(widgets)) delete widgets[key];

  zTop = Math.max(zTop, ...PANELS.map((panel) => layout[panel.id].z || 10));

  for (const panel of PANELS) {
    const state = layout[panel.id];
    if (!state.visible) continue;

    const widget = document.createElement("section");
    widget.className = "widget"
      + (panel.float ? " floating" : "")
      + (panel.pinned ? " pinned" : "");
    widget.dataset.panel = panel.id;

    const head = document.createElement("div");
    head.className = "w-head";
    head.innerHTML = `<span class="grip">&#10287;</span><h2>${panel.title}</h2><span class="spacer"></span>`;
    head.append(headExtras(panel.id));
    if (!panel.pinned) head.append(sizeMenu(panel.id));
    if (!panel.always) {
      const close = document.createElement("button");
      close.className = "ghost";
      close.textContent = "✕";
      close.title = "put this panel away";
      close.addEventListener("click", (event) => {
        event.stopPropagation();
        setPanelVisible(panel.id, false);
      });
      head.append(close);
    }

    const body = bodies[panel.id] || (bodies[panel.id] = document.createElement("div"));
    body.className = "w-body";

    widget.append(head, body);
    if (panel.id === "map") widget.append(transport());

    // A pinned panel keeps only the edge that divides it from its neighbour.
    const grips = panel.pinned ? ["e"] : ["n", "s", "w", "e", "nw", "ne", "sw", "se"];
    for (const direction of grips) {
      const handle = document.createElement("div");
      handle.className = `w-handle ${direction}`;
      widget.append(handle);
      makeResizable(widget, handle, panel.id, direction);
    }

    board.append(widget);
    widgets[panel.id] = widget;
    place(panel.id);

    if (!panel.pinned) makeDraggable(widget, head, panel.id);
    head.addEventListener("dblclick", (event) => {
      if (event.target.closest("button") || panel.pinned) return;
      toggleFull(panel.id);
    });
    widget.addEventListener("pointerdown", () => bringToFront(panel.id), true);
  }
  if (bodies.notify) renderNotices();
  restoreChrome();
}

/** buildBoard() replaces every header and the transport bar with fresh markup,
 *  which drops the title, the flag, the lap, the clock and the scrub with it.
 *  The panel bodies are carried over untouched; this puts the chrome back. */
function restoreChrome() {
  if (mapTitle) setTitle("map", mapTitle);
  if (typeof player === "undefined") return;

  if (player.bundle) {
    const scrub = el("scrub");
    if (scrub) scrub.max = String(Math.round(player.bundle.duration_s));
    if (el("flagStrip")) el("flagStrip").style.background = flagGradient(player.bundle);
    if (el("flagChip")) el("flagChip").hidden = false;
    renderOrder(player.lap || 1);
    setPlayable(player.framesReady !== false);
    renderFrame(player.time);      // clock, scrub, lap, flag, and both pills
    setPlaying(player.playing);
  } else {
    if (el("flagChip")) el("flagChip").hidden = true;
    if (el("orderLap")) el("orderLap").textContent = player.upcoming ? "provisional" : "—";
    renderRaceControl(0);
  }
}

/** The size control: the panel's own dimensions, and the sizes it can be. */
function sizeMenu(id) {
  const wrap = document.createElement("span");
  wrap.className = "size-menu";

  const button = document.createElement("button");
  button.className = "ghost size-btn";
  button.title = "resize this panel";
  button.textContent = `${layout[id].cw}×${layout[id].ch}`;

  const list = document.createElement("div");
  list.className = "size-list";
  list.hidden = true;
  for (const size of SIZES) {
    const option = document.createElement("button");
    const current = layout[id].cw === size.cw && layout[id].ch === size.ch;
    option.className = current ? "on" : "";
    option.innerHTML = `<span></span><em>${size.cw}×${size.ch}</em>`;
    option.querySelector("span").textContent = size.label;
    option.addEventListener("click", (event) => {
      event.stopPropagation();
      list.hidden = true;
      setSize(id, size.cw, size.ch);
      button.textContent = `${layout[id].cw}×${layout[id].ch}`;
    });
    list.append(option);
  }

  button.addEventListener("click", (event) => {
    event.stopPropagation();
    const opening = list.hidden;
    document.querySelectorAll(".size-list").forEach((other) => { other.hidden = true; });
    list.hidden = !opening;
  });
  wrap.append(button, list);
  return wrap;
}

document.addEventListener("click", () => {
  document.querySelectorAll(".size-list").forEach((list) => { list.hidden = true; });
});

/** Per-panel controls that live in the panel's own header. */
function headExtras(id) {
  const wrap = document.createElement("span");
  wrap.style.cssText = "display:flex;align-items:center;gap:8px";
  if (id === "map") {
    // The prediction is asked for from the top right of the circuit itself.
    wrap.innerHTML = '<span class="flag green" id="flagChip" hidden>green</span>';
    const ask = document.createElement("button");
    ask.id = "predictionBtn";
    ask.className = "accent" + (layout.prediction.visible ? " on" : "");
    ask.textContent = "Prediction";
    ask.title = "what the model makes of this lap";
    ask.addEventListener("click", (event) => {
      event.stopPropagation();
      const showing = !layout.prediction.visible;
      setPanelVisible("prediction", showing);
      if (showing) refreshProjection(player.lap || 1);
    });
    wrap.append(ask);
  } else if (id === "prediction") {
    const again = document.createElement("button");
    again.className = "ghost";
    again.textContent = "Ask again";
    again.addEventListener("click", (event) => {
      event.stopPropagation();
      refreshProjection(player.lap || 1, { fresh: true });
    });
    wrap.append(again);
  } else if (id === "control") {
    wrap.innerHTML = '<span class="pill" id="rcCount">&mdash;</span>';
  } else if (id === "order") {
    wrap.innerHTML = '<span class="pill" id="orderLap">&mdash;</span>';
  } else if (id === "notify") {
    wrap.innerHTML = '<span class="pill" id="notifCount">0</span>';
    const clear = document.createElement("button");
    clear.className = "ghost";
    clear.textContent = "Clear";
    clear.addEventListener("click", (event) => {
      event.stopPropagation();
      notices.length = 0;
      renderNotices();
    });
    wrap.append(clear);
  }
  return wrap;
}

function transport() {
  const bar = document.createElement("div");
  bar.className = "transport";
  bar.innerHTML = `
    <button id="playBtn" class="primary">&#9654;</button>
    <span class="lapcount" id="lapCount">lap &mdash;</span>
    <div class="scrubwrap">
      <input type="range" id="scrub" min="0" max="100" value="0" step="1" />
      <div id="flagStrip" title="flag state through the race"></div>
    </div>
    <span class="clock" id="clock">0:00 / 0:00</span>`;
  bar.querySelector("#playBtn").addEventListener("click", () => setPlaying(!player.playing));
  bar.querySelector("#scrub").addEventListener("input", (event) => {
    player.time = Number(event.target.value);
    renderFrame(player.time);
  });
  // Dragging the transport should scrub, not pick the panel up.
  bar.addEventListener("pointerdown", (event) => event.stopPropagation());
  return bar;
}

/* -- the grid, while it is being used ------------------------------------
   The grid is invisible until somebody is placing something against it, which
   is the only time it is information rather than decoration. */

function showGrid(on) {
  el("board").classList.toggle("gridded", on);
}

/** Where a panel would land, shown as an outline in the cells it would take. */
function ghost(id, c, r, cw, ch) {
  let node = el("ghost");
  if (!node) {
    node = document.createElement("div");
    node.id = "ghost";
    el("board").append(node);
  }
  const { w, h } = cell();
  node.style.left = `${(c * w + GUTTER / 2).toFixed(1)}px`;
  node.style.top = `${(r * h + GUTTER / 2).toFixed(1)}px`;
  node.style.width = `${(cw * w - GUTTER).toFixed(1)}px`;
  node.style.height = `${(ch * h - GUTTER).toFixed(1)}px`;
  node.hidden = false;
}

function hideGhost() {
  const node = el("ghost");
  if (node) node.hidden = true;
}

/* -- move -----------------------------------------------------------------
   The panel follows the pointer exactly, because anything else feels like
   lag, while an outline shows the cells it will actually take. On release it
   settles into them. That split -- the thing under your finger is free, the
   thing it will become is snapped -- is what makes an icon grid feel good
   rather than sticky. */

function makeDraggable(widget, handle, id) {
  handle.addEventListener("pointerdown", (event) => {
    if (event.target.closest("button")) return;
    if (window.innerWidth <= 900) return;   // stacked on narrow screens
    event.preventDefault();
    handle.setPointerCapture(event.pointerId);
    bringToFront(id);
    widget.classList.add("dragging");
    showGrid(true);

    const { w, h } = cell();
    const startX = event.clientX, startY = event.clientY;
    const originLeft = layout[id].c * w + GUTTER / 2;
    const originTop = layout[id].r * h + GUTTER / 2;
    let target = { c: layout[id].c, r: layout[id].r };

    const move = (moveEvent) => {
      const left = originLeft + moveEvent.clientX - startX;
      const top = originTop + moveEvent.clientY - startY;
      widget.style.left = `${left.toFixed(1)}px`;
      widget.style.top = `${top.toFixed(1)}px`;
      target = {
        c: clampCell(Math.round(left / w), layout[id].cw, GRID_COLS),
        r: clampCell(Math.round(top / h), layout[id].ch, GRID_ROWS),
      };
      ghost(id, target.c, target.r, layout[id].cw, layout[id].ch);
    };
    const up = () => {
      handle.removeEventListener("pointermove", move);
      handle.removeEventListener("pointerup", up);
      handle.removeEventListener("pointercancel", up);
      widget.classList.remove("dragging");
      widget.classList.add("settling");
      setTimeout(() => widget.classList.remove("settling"), 340);
      showGrid(false);
      hideGhost();
      layout[id].c = target.c;
      layout[id].r = target.r;
      place(id);
      saveLayout();
    };
    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", up);
    handle.addEventListener("pointercancel", up);
  });
}

/* -- resize ---------------------------------------------------------------
   Whole cells only, so an edge cannot come to rest a few pixels off a line.
   The edge being dragged is shared with whatever is on the other side of it:
   two panels either side of a gutter are reading as a split, not as two things
   that happen to be near each other, so widening one narrows the other. */

function neighboursOn(id, direction) {
  const mine = layout[id];
  const found = [];
  for (const [other, state] of Object.entries(layout)) {
    if (other === id || !state.visible || BY_ID[other].pinned) continue;
    const overlapRows = Math.min(mine.r + mine.ch, state.r + state.ch) - Math.max(mine.r, state.r);
    const overlapCols = Math.min(mine.c + mine.cw, state.c + state.cw) - Math.max(mine.c, state.c);
    let touching = false;
    if (direction.includes("e")) touching = state.c === mine.c + mine.cw && overlapRows > 0;
    else if (direction.includes("w")) touching = state.c + state.cw === mine.c && overlapRows > 0;
    else if (direction.includes("s")) touching = state.r === mine.r + mine.ch && overlapCols > 0;
    else if (direction.includes("n")) touching = state.r + state.ch === mine.r && overlapCols > 0;
    if (touching) found.push({ id: other, c: state.c, r: state.r, cw: state.cw, ch: state.ch });
  }
  return found;
}

function makeResizable(widget, handle, id, direction) {
  handle.addEventListener("pointerdown", (event) => {
    if (window.innerWidth <= 900) return;
    event.preventDefault();
    event.stopPropagation();
    handle.setPointerCapture(event.pointerId);
    bringToFront(id);
    widget.classList.add("sizing");
    showGrid(true);

    const { w, h } = cell();
    const startX = event.clientX, startY = event.clientY;
    const from = { c: layout[id].c, r: layout[id].r, cw: layout[id].cw, ch: layout[id].ch };
    const neighbours = neighboursOn(id, direction);
    // How far the edge may travel before a neighbour is squeezed out.
    const room = neighbours.length
      ? Math.min(...neighbours.map((n) => (
          direction.includes("e") || direction.includes("w") ? n.cw - MIN_CW : n.ch - MIN_CH)))
      : Infinity;

    const move = (moveEvent) => {
      const dc = Math.round((moveEvent.clientX - startX) / w);
      const dr = Math.round((moveEvent.clientY - startY) / h);
      let { c, r, cw, ch } = from;

      if (direction.includes("e")) {
        cw = Math.max(MIN_CW, Math.min(GRID_COLS - c, from.cw + Math.min(dc, room)));
      }
      if (direction.includes("w")) {
        const edge = Math.max(0, Math.min(from.c + from.cw - MIN_CW, from.c + Math.max(dc, -room)));
        cw = from.c + from.cw - edge; c = edge;
      }
      if (direction.includes("s")) {
        ch = Math.max(MIN_CH, Math.min(GRID_ROWS - r, from.ch + Math.min(dr, room)));
      }
      if (direction.includes("n")) {
        const edge = Math.max(0, Math.min(from.r + from.ch - MIN_CH, from.r + Math.max(dr, -room)));
        ch = from.r + from.ch - edge; r = edge;
      }

      Object.assign(layout[id], { c, r, cw, ch });
      place(id);
      ghost(id, c, r, cw, ch);

      // The edge belongs to the panel on the other side of it too.
      const shiftC = direction.includes("e") ? cw - from.cw
        : direction.includes("w") ? from.c - c : 0;
      const shiftR = direction.includes("s") ? ch - from.ch
        : direction.includes("n") ? from.r - r : 0;

      for (const other of neighbours) {
        const state = layout[other.id];
        if (direction.includes("e")) { state.c = other.c + shiftC; state.cw = other.cw - shiftC; }
        else if (direction.includes("w")) { state.cw = other.cw - shiftC; }
        else if (direction.includes("s")) { state.r = other.r + shiftR; state.ch = other.ch - shiftR; }
        else if (direction.includes("n")) { state.ch = other.ch - shiftR; }
        place(other.id);
      }

      if ((id === "map" || neighbours.some((n) => n.id === "map")) && player.bounds) fitMap();
    };
    const up = () => {
      handle.removeEventListener("pointermove", move);
      handle.removeEventListener("pointerup", up);
      handle.removeEventListener("pointercancel", up);
      widget.classList.remove("sizing");
      showGrid(false);
      hideGhost();
      saveLayout();
      const button = widget.querySelector(".size-btn");
      if (button) button.textContent = `${layout[id].cw}×${layout[id].ch}`;
      if (player.bundle) renderFrame(player.time);
    };
    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", up);
    handle.addEventListener("pointercancel", up);
  });
}

window.addEventListener("resize", placeAll);

/* -- the panels menu --------------------------------------------------- */

function buildPanelsMenu() {
  const menu = el("panelsMenu");
  menu.textContent = "";
  for (const panel of PANELS) {
    if (panel.always) continue;
    const label = document.createElement("label");
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = layout[panel.id].visible;
    box.addEventListener("change", () => {
      setPanelVisible(panel.id, box.checked);
      if (panel.id === "prediction" && box.checked) refreshProjection(player.lap || 1);
    });
    label.append(box, document.createTextNode(panel.title));
    menu.append(label);
  }
  const heading = document.createElement("div");
  heading.className = "menu-heading";
  heading.textContent = "Arrangements";
  menu.append(document.createElement("hr"), heading);

  for (const [name, preset] of Object.entries(PRESETS)) {
    const option = document.createElement("button");
    option.className = "preset" + (name === currentPreset ? " on" : "");
    option.innerHTML = `<b></b><small></small>`;
    option.querySelector("b").textContent = preset.label;
    option.querySelector("small").textContent = preset.hint;
    option.addEventListener("click", (event) => {
      event.stopPropagation();
      applyPreset(name);
      el("panelsMenu").hidden = true;
    });
    menu.append(option);
  }

  const hint = document.createElement("div");
  hint.style.cssText = "padding:8px 9px 4px;color:var(--dim);font-size:11.5px;line-height:1.45";
  hint.textContent = "Drag a panel by its header to move it; drag an edge to resize it and the "
    + "panel beside it. The circuit stays on the left.";
  menu.append(document.createElement("hr"), hint);
}

el("panelsBtn").addEventListener("click", (event) => {
  event.stopPropagation();
  el("panelsMenu").hidden = !el("panelsMenu").hidden;
});
document.addEventListener("click", () => { el("panelsMenu").hidden = true; });
el("panelsMenu").addEventListener("click", (event) => event.stopPropagation());

el("resetLayout").addEventListener("click", () => applyPreset(currentPreset));

/* -- keyboard ------------------------------------------------------------
   The transport, without having to find the scrub bar with a pointer. Typing
   in the search box is still typing, so the keys are ignored there. */

document.addEventListener("keydown", (event) => {
  const target = event.target;
  if (target && target.matches && target.matches("input, select, textarea")) return;
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  if (!player.bundle) return;

  const step = event.shiftKey ? 60 : 10;
  const seek = (to) => {
    player.time = Math.min(Math.max(to, 0), player.bundle.duration_s);
    renderFrame(player.time);
  };

  switch (event.key) {
    case " ":       event.preventDefault(); setPlaying(!player.playing); break;
    case "ArrowLeft":  event.preventDefault(); seek(player.time - step); break;
    case "ArrowRight": event.preventDefault(); seek(player.time + step); break;
    case "Home":    event.preventDefault(); seek(0); break;
    case "End":     event.preventDefault(); seek(player.bundle.duration_s); break;
    case "p": case "P": {
      event.preventDefault();
      const showing = !layout.prediction.visible;
      setPanelVisible("prediction", showing);
      if (showing) refreshProjection(player.lap || 1);
      break;
    }
    default: break;
  }
});

/* ======================================================================
 * Notifications
 *
 * Two things are worth interrupting a viewer for: a call from race control,
 * and a car changing hands. Both land in the panel, which keeps them, and in
 * a card in the corner, which does not.
 * ================================================================== */

const notices = [];
const MAX_NOTICES = 80;

/** Race control talks constantly, and most of it is housekeeping: a blue flag
 *  for a car about to be lapped, and the per-sector yellow-then-clear chatter
 *  that follows every incident. A Zandvoort race carries 333 calls, of which
 *  248 are these. They all stay in the race control panel, which is the full
 *  log; none of them earns an interruption.
 *
 *  Which is which is decided by the backend and carried on the message, so a
 *  live call and a replayed one are judged by the same rule. The pattern below
 *  is only for a bundle built before that field existed. */
const RC_HOUSEKEEPING = /WAVED BLUE FLAG|IN TRACK SECTOR/i;
const worthAnnouncing = (event) => (
  event.severity
    ? event.severity !== "housekeeping"
    : !RC_HOUSEKEEPING.test(event.message || "")
);

function notify(kind, title, detail, stamp) {
  // The same call twice running is one thing that happened, not two.
  const newest = notices[0];
  if (newest && newest.kind === kind && newest.title === title && newest.detail === detail) return;
  notices.unshift({ kind, title, detail, stamp: stamp || "" });
  while (notices.length > MAX_NOTICES) notices.pop();
  renderNotices();
  toast(kind, title, detail, stamp);
}

function clearNotices() {
  notices.length = 0;
  renderNotices();
}

function renderNotices() {
  const container = bodies.notify;
  if (el("notifCount")) el("notifCount").textContent = String(notices.length);
  if (!container) return;
  if (!notices.length) {
    container.innerHTML = '<div class="empty">Nothing yet. Overtakes and race control land here.</div>';
    return;
  }
  container.textContent = "";
  for (const notice of notices) {
    const row = document.createElement("div");
    row.className = `notif ${notice.kind}`;
    row.innerHTML = `<span class="edge"></span>
      <span class="txt">
        <span class="when">${notice.stamp}</span>
        <b>${notice.title}</b>
        <small title="${(notice.detail || "").replace(/"/g, "&quot;")}">${notice.detail || ""}</small>
      </span>`;
    container.append(row);
  }
}

/* -- the island -----------------------------------------------------------
   Everything the page announces comes through here: the replay's own events,
   race control, and whatever a live session pushes. One object, one place, so
   a viewer learns to read it once and never has to dismiss anything.

   How long it speaks depends on what it says. A call from race control changes
   how the race is being run and holds for ten seconds; a car changing hands is
   worth five. Anything arriving while it is already speaking queues behind. */

const ISLAND_LIFE_MS = { control: 10000, drop: 8000, pass: 5000 };

const island = {
  queue: [],
  speaking: false,
  timer: null,
  held: false,
};

function islandIdleContent() {
  if (!player.bundle || !player.bundle.frames || !player.bundle.frames.length) {
    return '<span class="isl-dot"></span><span class="isl-idle">F1 2026</span>';
  }
  const flag = player.flag || "green";
  const total = player.bundle.total_laps || 0;
  const lap = player.lap || 0;
  return `<span class="isl-dot ${flag}"></span>`
    + `<span class="isl-idle">${flag.replace("_", " ")} · `
    + `<b>lap ${lap}${total ? ` / ${total}` : ""}</b></span>`;
}

/** Measure what the island would have to become, then become it. */
function islandSet(html, { kind, life } = {}) {
  const node = el("island");
  const inner = el("islandInner");
  const sizer = el("islandSizer");
  if (!node || !inner || !sizer) return;

  sizer.innerHTML = html;
  const width = Math.ceil(sizer.offsetWidth) + 2;
  const height = Math.max(34, Math.ceil(sizer.offsetHeight) + 2);

  inner.classList.add("swap");
  setTimeout(() => {
    inner.innerHTML = html;
    node.style.width = `${width}px`;
    node.style.height = `${height}px`;
    node.classList.toggle("speaking", Boolean(kind));
    inner.classList.remove("swap");

    const life = node.querySelector("#islandLife");
    if (life) life.remove();
  }, 130);

  if (kind && life) {
    const bar = document.createElement("i");
    bar.id = "islandLife";
    bar.className = kind;
    node.append(bar);
    requestAnimationFrame(() => {
      bar.style.transition = "none";
      bar.style.transform = "scaleX(1)";
      requestAnimationFrame(() => {
        bar.style.transition = `transform ${life}ms linear`;
        bar.style.transform = "scaleX(0)";
      });
    });
  }
}

function islandIdle() {
  island.speaking = false;
  islandSet(islandIdleContent());
}

/** Refresh the resting state without disturbing anything being said. */
function islandTick() {
  if (island.speaking || island.queue.length) return;
  const inner = el("islandInner");
  if (!inner || inner.classList.contains("swap")) return;
  const next = islandIdleContent();
  if (inner.dataset.idle === next) return;
  inner.dataset.idle = next;
  islandSet(next);
}

function toast(kind, title, detail, stamp) {
  island.queue.push({ kind, title, detail, stamp });
  if (!island.speaking) islandNext();
}

function islandNext() {
  const item = island.queue.shift();
  if (!item) { islandIdle(); return; }

  island.speaking = true;
  const life = ISLAND_LIFE_MS[item.kind] || 6000;
  const detail = item.detail
    ? `<small>${escapeText(item.detail)}</small>` : "";
  islandSet(
    `<span class="isl-dot ${item.kind}"></span>`
    + `<span class="isl-text"><b>${escapeText(item.title)}</b>${detail}</span>`
    + (item.stamp ? `<span class="isl-stamp">${escapeText(item.stamp)}</span>` : ""),
    { kind: item.kind, life },
  );

  clearTimeout(island.timer);
  island.timer = setTimeout(() => {
    if (island.held) return;              // the pointer is resting on it
    islandNext();
  }, life);
}

function escapeText(value) {
  const node = document.createElement("span");
  node.textContent = String(value ?? "");
  return node.innerHTML;
}

/* The resting state is also refreshed on a slow timer, not only from the
   render loop: a tick that lands while the island is mid-transition has to be
   skipped, and when the race is paused there is no next frame to retry on. */
setInterval(islandTick, 500);

/* Resting a pointer on the island holds whatever it is saying. */
el("island").addEventListener("pointerenter", () => {
  island.held = true;
  const bar = document.getElementById("islandLife");
  if (bar) {
    const current = getComputedStyle(bar).transform;
    bar.style.transition = "none";
    bar.style.transform = current;
  }
});
el("island").addEventListener("pointerleave", () => {
  island.held = false;
  if (island.speaking) { clearTimeout(island.timer); island.timer = setTimeout(islandNext, 1400); }
});
el("island").addEventListener("click", () => {
  if (island.speaking) { clearTimeout(island.timer); island.held = false; islandNext(); }
});

/** Overtakes, as the playhead reaches them.
 *
 *  These are no longer inferred in the browser. The backend reads them out of
 *  the position feed at one-second resolution -- which per-lap order rows
 *  cannot do -- excludes the pit cycle using the stop count, and folds "the
 *  whole field went past one car" into the one thing it actually was: a car in
 *  trouble. Every viewer therefore sees the same events, at the moment they
 *  happened rather than at the lap boundary that followed. */
let eventsSeen = 0;

function renderEvents(upTo) {
  const bundle = player.bundle;
  const events = (bundle && bundle.events) || [];
  if (upTo < eventsSeen) { eventsSeen = upTo; return; }   // scrubbed backwards
  if (upTo - eventsSeen > SEEK_JUMP_S) { eventsSeen = upTo; return; }   // seeked past
  if (!events.length) { eventsSeen = upTo; return; }

  const drivers = new Map((bundle.drivers || []).map((driver) => [driver.number, driver]));
  const name = (number) => {
    const driver = drivers.get(number);
    return (driver && driver.code) || number;
  };

  for (const event of events) {
    if (event.t <= eventsSeen || event.t > upTo) continue;
    if (event.kind === "drop") {
      notify("drop", `${name(event.car)} drops to P${event.position}`,
        `passed by ${event.passed_by} cars, from P${event.from_position}`, `L${event.lap}`);
    } else {
      notify("pass", `${name(event.car)} takes P${event.position}`,
        `past ${name(event.over)}`, `L${event.lap}`);
    }
  }
  eventsSeen = upTo;
}

/** Who gained places between one lap and the next, inferred from the per-lap
 *  order alone.
 *
 *  Superseded by the bundle's own events, which the backend reads out of the
 *  position feed with real timestamps. This remains for a bundle built before
 *  that existed, which carries no ``events`` array: a car that finished the lap
 *  ahead of one it started behind, with the pit cycle excluded by stop count. */
function reportOvertakes(fromLap, toLap) {
  const laps = (player.bundle && player.bundle.laps) || {};
  const before = laps[String(fromLap)], after = laps[String(toLap)];
  if (!before || !after) return;

  const was = new Map(before.map((row) => [row.number, row.position]));
  const stopsWas = new Map(before.map((row) => [row.number, row.stops || 0]));
  const pitted = (row) => (row.stops || 0) > (stopsWas.get(row.number) || 0);
  const drivers = new Map(player.bundle.drivers.map((driver) => [driver.number, driver]));

  const gained = after
    .filter((row) => was.has(row.number) && was.get(row.number) > row.position && !pitted(row))
    .sort((a, b) => (was.get(b.number) - b.position) - (was.get(a.number) - a.position))
    .slice(0, 3);

  for (const row of gained) {
    const startedAt = was.get(row.number);
    // The car it passed: the closest one it started behind, finished ahead of,
    // and which did not simply hand the place over on its way into the pits.
    const passed = after
      .filter((other) => was.has(other.number) && !pitted(other)
        && was.get(other.number) < startedAt && other.position > row.position)
      .sort((a, b) => a.position - b.position)[0];
    if (!passed) continue;

    const who = drivers.get(row.number) || {};
    const victim = drivers.get(passed.number) || {};
    notify("pass", `${who.code || row.number} takes P${row.position}`,
      `past ${victim.code || passed.number}, up from P${startedAt}`, `L${toLap}`);
  }
}

/* ======================================================================
 * The circuit
 * ================================================================== */

const player = {
  bundle: null, sessionKey: null, path: [], pitPath: [], bounds: null,
  playing: false, time: 0, speed: 10, lastFrameAt: 0, lap: 0, selected: null,
  upcoming: null,
};

function mapMarkup() {
  return `
    <div id="mapWrap">
      <svg id="map" preserveAspectRatio="xMidYMid meet">
        <path id="trackGlow" /><path id="trackHalo" />
        <path id="pitLine" /><path id="pitSurface" />
        <path id="trackLine" /><path id="trackSurface" />
        <line id="startLine" />
        <g id="cars"></g>
        <g id="carLabels"></g>
      </svg>
      <div id="countdown" hidden>
        <div class="k" id="cdKind">lights out in</div>
        <div class="t" id="cdTime">—</div>
        <div class="w" id="cdWhen"></div>
      </div>
    </div>`;
}

function fitTransform(bounds, width, height, pad) {
  const spanX = Math.max(bounds.max_x - bounds.min_x, 1);
  const spanY = Math.max(bounds.max_y - bounds.min_y, 1);
  const scale = Math.min((width - pad * 2) / spanX, (height - pad * 2) / spanY);
  const offsetX = (width - spanX * scale) / 2;
  const offsetY = (height - spanY * scale) / 2;
  return (x, y) => [
    offsetX + (x - bounds.min_x) * scale,
    height - offsetY - (y - bounds.min_y) * scale,
  ];
}

function toPathData(points, close) {
  if (!points.length) return "";
  return points.map(([x, y], index) => `${index ? "L" : "M"}${x.toFixed(1)} ${y.toFixed(1)}`).join(" ")
    + (close ? " Z" : "");
}

/** Redraw the circuit into whatever space the panel currently has.
 *  Called on load, on resize and whenever the map panel is resized. */
function fitMap() {
  const wrap = el("mapWrap");
  if (!wrap || !player.bounds) return;
  const width = Math.max(wrap.clientWidth, 200);
  const height = Math.max(wrap.clientHeight, 200);
  el("map").setAttribute("viewBox", `0 0 ${width} ${height}`);

  const project = fitTransform(player.bounds, width, height, 22);
  player.path = player.rawPath.map(([x, y]) => project(x, y));
  player.pitPath = player.rawPit.map(([x, y]) => project(x, y));

  for (const id of ["trackGlow", "trackHalo", "trackLine", "trackSurface"]) {
    el(id).setAttribute("d", toPathData(player.path, true));
  }
  el("pitLine").setAttribute("d", toPathData(player.pitPath, false));
  el("pitSurface").setAttribute("d", toPathData(player.pitPath, false));

  const [sx, sy] = player.path[0];
  const [nx, ny] = player.path[1] || [sx + 1, sy];
  const angle = Math.atan2(ny - sy, nx - sx) + Math.PI / 2;
  el("startLine").setAttribute("x1", sx + Math.cos(angle) * 8);
  el("startLine").setAttribute("y1", sy + Math.sin(angle) * 8);
  el("startLine").setAttribute("x2", sx - Math.cos(angle) * 8);
  el("startLine").setAttribute("y2", sy - Math.sin(angle) * 8);
}

function setTrack(track) {
  player.rawPath = track.path;
  player.rawPit = track.pit_path || [];
  player.bounds = track.bounds;
  fitMap();
}

window.addEventListener("resize", () => { if (player.bounds) { fitMap(); renderFrame(player.time); } });

/* -- a race that has run ------------------------------------------------ */

/** Open a race that has run.
 *
 *  The bundle is 475 KB and 439 KB of that is playback frames -- positions,
 *  once a second, for two hours. Everything needed to put the race on screen
 *  is in the other 36 KB: the circuit, the drivers, the per-lap order, the
 *  race-control log, the overtakes and the classification. So the metadata is
 *  fetched first and drawn immediately, and the frames stream in behind it.
 *  The circuit is up in a fraction of the time, and the only thing that waits
 *  is the play button. */
async function openReplay(sessionKey, meta) {
  setStatus("reading the race…");
  let bundle;
  try {
    bundle = await api(`/replays/${sessionKey}/meta`);
  } catch (error) {
    setStatus("replay not built", "error");
    return false;
  }

  stopCountdown();
  bundle.frames = [];
  player.bundle = bundle;
