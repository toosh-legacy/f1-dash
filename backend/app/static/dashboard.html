<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>F1 2026 · Live Prediction Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🏁</text></svg>" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>

<div id="boot">
  <canvas id="bootCanvas"></canvas>
  <div id="bootVeil"></div>
  <div class="boot-card">
    <div class="glitch" data-text="F1 2026">F1 2026</div>
    <div class="boot-sub">live prediction dashboard</div>
    <div class="boot-bar"><i></i></div>
    <div id="bootStage">tuning the channel</div>
  </div>
</div>

<!-- Liquid glass: what is behind a pane is bent, most at its rim, the way a
     thick curved edge refracts. A smooth noise field gives the bend; the
     panes use it through backdrop-filter where the browser supports an SVG
     filter there (Chromium), and fall back to plain frosted glass elsewhere. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="liquid" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="2" seed="7" result="noise" />
    <feGaussianBlur in="noise" stdDeviation="3" result="field" />
    <feDisplacementMap in="SourceGraphic" in2="field" scale="38" xChannelSelector="R" yChannelSelector="G" result="bent" />
    <feGaussianBlur in="bent" stdDeviation="9" />
  </filter>
</svg>

<!-- What the glass bends: Spa in the wet, out of focus. -->
<div id="backdrop" aria-hidden="true"></div>

<main id="glass">
  <div id="stage">
    <!-- The circuit's real surroundings, from OpenStreetMap: drawn once per
         circuit and never touched by playback, so it sits on its own layer. -->
    <svg id="mapBase" aria-hidden="true">
      <g id="osm">
        <path id="osm-grass" /><path id="osm-wood" /><path id="osm-water" />
        <path id="osm-paved" /><path id="osm-gravel" /><path id="osm-road" />
        <path id="osm-tarmac" /><path id="osm-building" /><path id="osm-stand" />
      </g>
    </svg>
    <svg id="map" preserveAspectRatio="xMidYMid meet" aria-label="circuit map">
      <defs>
        <pattern id="chequer" width="6" height="6" patternUnits="userSpaceOnUse">
          <rect width="6" height="6" fill="#fff" />
          <rect width="3" height="3" fill="#111" /><rect x="3" y="3" width="3" height="3" fill="#111" />
        </pattern>
        <!-- The service road is the edge of a wide band, not the band: the
             inside is cut away so the map shows through it. -->
        <mask id="roadMask" maskUnits="userSpaceOnUse" x="-5000" y="-5000" width="20000" height="20000">
          <rect x="-5000" y="-5000" width="20000" height="20000" fill="#fff" />
          <path id="serviceRoadCut" />
        </mask>
        <filter id="soften" x="-10%" y="-10%" width="120%" height="120%">
          <feGaussianBlur stdDeviation="3" />
        </filter>
      </defs>
      <g id="terrain">
        <path id="infield" />
        <path id="serviceRoad" mask="url(#roadMask)" />
        <path id="grass" filter="url(#soften)" />
        <path id="runoff" />
      </g>
      <path id="pitEdge" /><path id="pitSurface" /><path id="pitMark" />
      <path id="trackEdge" />
      <!-- The flags, painted onto the white edge of the section they cover. -->
      <g id="flagEdges"></g>
      <path id="trackSurface" /><path id="trackSheen" />
      <line id="startLine" />
      <g id="marshals"></g>
      <g id="cars"></g>
    </svg>

    <div id="countdown" hidden>
      <div class="cd-plate">
        <div class="c" id="cdCircuit"></div>
        <div class="k" id="cdKind">lights out in</div>
        <div class="t" id="cdTime" role="timer">—</div>
        <div class="w" id="cdWhen"></div>
      </div>
    </div>

    <!-- A replay being built: the circuit drawing itself while the feed
         comes in, and how far along the build is. -->
    <div id="building" hidden role="status" aria-live="polite">
      <div class="build-plate">
        <svg class="build-art" viewBox="0 0 120 80" aria-hidden="true">
          <path class="build-ghost" id="buildGhost" />
          <path class="build-trace" id="buildTrace" pathLength="100" />
          <circle class="build-car" r="3.2"><animateMotion id="buildMotion" dur="2.6s" repeatCount="indefinite" /></circle>
        </svg>
        <div class="build-title" id="buildTitle">Building the replay</div>
        <ol class="build-steps" id="buildSteps">
          <li data-step="session">Session</li>
          <li data-step="timing">Timing</li>
          <li data-step="locations">Car positions</li>
          <li data-step="frames">Frames</li>
          <li data-step="stored">Saving</li>
        </ol>
        <div class="build-bar"><i id="buildBar"></i></div>
        <div class="build-detail" id="buildDetail">asking OpenF1…</div>
      </div>
    </div>

    <div id="osmCredit" hidden>© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div>

    <!-- The selected car's numbers, held over the car itself. -->
    <div id="probe" hidden role="dialog" aria-label="car telemetry"></div>
  </div>

  <header id="topbar" class="glass-chip">
    <b class="brand">F1</b>
    <button id="pickerBtn" class="picker-btn" aria-haspopup="dialog" aria-expanded="false">
      <span class="mode-tag" id="modeTag">—</span>
      <span id="sessionTitle">Choose a race</span>
      <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" /></svg>
    </button>
    <button id="predictBtn" class="predict-btn" aria-pressed="false" aria-controls="predict" title="Where they finish from here (P)" disabled>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 12 6 8l3 3 5-6" /><path d="M10 5h4v4" /></svg>
      Predict
    </button>
    <span class="status" title="connection"><span class="dot" id="dot"></span><span id="statusText">idle</span></span>
  </header>

  <!-- The race picker: what is live, what is next, and every race that ran. -->
  <div id="picker" class="glass-chip" role="dialog" aria-label="choose a race" hidden>
    <div class="finder">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" /><path d="m10.5 10.5 3 3" /></svg>
      <input type="search" id="search" placeholder="Search a race…" autocomplete="off" aria-label="search a race" />
    </div>
    <div class="results" id="results"></div>
  </div>

  <div id="island" class="idle" aria-live="polite">
    <div id="islandInner"></div>
  </div>
  <div id="islandSizer" aria-hidden="true"></div>

  <!-- The prediction, summoned over the map. -->
  <section id="predict" class="glass-chip" aria-label="prediction" hidden>
    <div class="predict-top">
      <div>
        <div class="predict-kind">Prediction</div>
        <div class="predict-lap" id="predictLap">—</div>
      </div>
      <button id="predictClose" class="predict-close" aria-label="close prediction">&times;</button>
    </div>
    <div class="predict-head" id="predictHead"></div>
    <div id="predictRows"></div>
    <div class="predict-foot" id="predictFoot"></div>
  </section>

  <aside id="tower" class="glass-chip" aria-label="timing">
    <div class="tower-head">
      <div>
        <div class="tower-kind" id="towerKind">Race</div>
        <div class="tower-lap" id="towerLap">—</div>
      </div>
      <div class="tower-col" id="towerCol">Interval</div>
    </div>
    <div id="towerRows"></div>
  </aside>

  <footer id="transport" class="glass-chip">
    <button id="playBtn" class="play" aria-label="play" disabled>&#9654;</button>
    <div class="scrubwrap">
      <input type="range" id="scrub" min="0" max="100" value="0" step="1" aria-label="race time" disabled />
      <div id="flagStrip" title="flag state through the race"></div>
    </div>
    <span class="clock" id="clock">0:00 / 0:00</span>
    <select id="speed" title="playback speed" aria-label="playback speed">
      <option value="1">1&times;</option>
      <option value="4">4&times;</option>
      <option value="10" selected>10&times;</option>
      <option value="30">30&times;</option>
      <option value="60">60&times;</option>
    </select>
  </footer>
</main>

<script src="config.js"></script>
<script type="module" src="js/boot.js"></script>
</body>
</html>
