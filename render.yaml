# Render blueprint for the API half of the dashboard.
#
# The frontend does not appear here: it is static, and it deploys to Vercel via
# vercel.json. What is left is the part Vercel cannot host -- a container that
# holds WebSockets open and trains models on background threads -- plus the two
# stores that keep its state when the container is replaced: managed Postgres
# for the rows, and an S3 bucket (created outside Render) for the artifacts.

databases:
  - name: f1-dash-db
    databaseName: f1_dash
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: f1-dash-api
    runtime: docker
    plan: starter          # free instances sleep, and a sleeping live loop is not live
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    disk:
      # Purely a warm cache in front of S3 -- losing it costs a download, not data.
      name: artifact-cache
      mountPath: /var/cache/f1
      sizeGB: 10
    envVars:
      - key: F1_DATABASE_URL
        fromDatabase:
          name: f1-dash-db
          property: connectionString
      - key: F1_BLOB_BACKEND
        value: s3
      - key: F1_S3_BUCKET
        sync: false        # set in the dashboard: the bucket you created
      - key: F1_S3_PREFIX
        value: prod
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: F1_CORS_ORIGINS
        sync: false        # your Vercel origin, e.g. https://f1-dash.vercel.app
      - key: F1_ENV
        value: production
      - key: F1_SEASON
        value: "2026"
      - key: F1_REGS_REGIME
        value: "2026"
